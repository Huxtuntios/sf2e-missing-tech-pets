name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build and verify release assets
        run: npm run package -- --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/module.json
            dist/module.zip
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
